-- Headless runner for capture.lua: no window, one draw cycle, then exit.
--
--   conky -c tools/capture/capture.conf
--
-- Needs the clock tree (default ~/.config/conky/clocks, override with CLOCK_DIR)
-- and a conky built with Lua + cairo.  Nothing is drawn to the desktop: out_to_x
-- is off, so every dial renders into an offscreen cairo image surface.

conky.config = {
  alignment = 'top_left',
  minimum_width = 1, minimum_height = 1, maximum_width = 1,
  background = false,
  total_run_times = 1,
  update_interval = 1,
  out_to_x = false,
  out_to_console = false,
  out_to_stderr = false,
  lua_load = os.getenv('CAP_LUA') or (os.getenv('PWD') .. '/tools/capture/capture.lua'),
  lua_draw_hook_post = 'capture',
}
conky.text = [[]]
